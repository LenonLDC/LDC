[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ldc-pdm-assistant"
version = "0.1.0"
description = "Assistente local para consulta de códigos PD em fichas técnicas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "xlrd>=2.0.1,<3",
]

[project.scripts]
pdm-assistant = "pdm_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["pdm_assistant*"]
